name: Publish package to npm
# `release: published` is a dead trigger in this org: releases are created
# by the reusable_github_release workflow using the workflow GITHUB_TOKEN,
# and GitHub never fires workflows for events created with that token (the
# v2.3.0 release proved it — zero runs dispatched). Follow the org pattern
# instead (see baby-tester's publish.yml): trigger on version-tag pushes,
# with a manual dispatch fallback for stuck/past releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Setup .npmrc file to publish to GitHub Packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
