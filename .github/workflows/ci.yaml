name: Publish package to npm
# `release: published` is a dead trigger in this org: releases are created
# by the reusable_github_release workflow using the workflow GITHUB_TOKEN,
# and GitHub never fires workflows for events created with that token (the
# v2.3.0 release proved it — zero runs dispatched). Follow the org pattern
# instead (see baby-tester's publish.yml): trigger on version-tag pushes,
# with a manual dispatch fallback for stuck/past releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Manual dispatch lets the operator pick any ref; without this guard a
      # feature branch carrying a version bump could be published to npm as
      # `latest` unreviewed. Only main and v* tags may publish.
      - name: Reject manual dispatch from non-release refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Manual dispatch may only publish main or a v* tag, got: $REF"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 24 ships npm >= 11.5, required for OIDC trusted publishing.
      # No registry-url: setup-node would write an .npmrc token placeholder
      # that breaks npm when NODE_AUTH_TOKEN is unset; the default registry
      # is npmjs, which is where we publish.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - run: npm ci
      # Auth is npm OIDC trusted publishing (id-token: write above) — the
      # org pattern used by ts-sdk/btc-staking-ts/wallet-connector; no
      # long-lived NPM_TOKEN secret. Requires the trusted publisher
      # (repo babylonlabs-io/bitcoind-client, workflow ci.yaml) to be
      # registered for @babylonlabs-io/bitcoind-client on npmjs.
      - run: npm publish --provenance --access public
